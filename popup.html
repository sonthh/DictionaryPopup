    <!-- SEARCH BOX 320 -->
    <!-- By using this code you agree to our terms and conditions at https://www.oxfordlearnersdictionaries.com/about/search_widget_info_english.html -->
    <div id="oxford_seachbox">
        <div id="oxford_oldform">
            <div id="dictionarySelector320"
                style="width:23px;height:24px;float:left;padding:0; overflow-x:hidden;margin-top:2px;">
                <select id="sl_dictionary"
                    style="width:23px;height:24px;text-indent:-9999px; border:0;background:transparent;-webkit-appearance:none;-moz-appearance:none;padding-left:35px"
                    onchange="this.form.action = this.value">
                    <option value="https://www.oxfordlearnersdictionaries.com/search/english/direct/"
                        style="text-indent:0px">English</option>
                    <option value="https://www.oxfordlearnersdictionaries.com/search/american_english/direct/"
                        style="text-indent:0px">American English</option>
                </select>
            </div>
            <div style="width:253px;height:25px;float:left; margin-left:0;">
                <input type="text" name="q" id="txt_oxford_searchfield" size="21" maxlength="100"
                    style="width:246px; height:18px;border:0;padding-left:5px;margin-top:3px;border-radius:20px;"
                    autofocus autocomplete="off">
            </div>
            <div style="width:25px;height:25px;float:left;margin-left:1px">
                <input type="button" id="btn_oxford_search"
                    style="background:none; border:none;width:25px;height:24px; margin-top:2px;margin-left:-2px;cursor: pointer;">
            </div>
        </div>
    </div>
    <!-- END SEARCH BOX -->
    <br>
    <!-- WORD LIST -->
    <div class="center_wrap">

        <!-- <h2>Last word: <span id="last_word"></span></h2> -->
        <!-- WORD TABLE -->
        <table class="wl-table" id="wordTable">
            <colgroup>
                <col style="width:70%">
                <col style="width:30%">
            </colgroup>
            <tbody>
                <tr>
                    <td>Word</td>
                    <td>Action</td>
                </tr>
            </tbody>
        </table>
        <br>
        <!-- END WORD TABLE -->


    </div>
    <!-- END WORD LIST -->
